[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "care-transition-agent"
version = "0.1.0"
description = "Drafts a patient's care-transfer profile from hospital documents: grounded, pseudonymised, released by a clinician."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "httpx>=0.27",
  "pyyaml>=6",
  "langgraph>=0.6",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "prometheus-client>=0.20",
  "cryptography>=43",
  "numpy>=1.26",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
cta = "cta.cli:main"
ctasim = "ctasim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cta = ["sql/*.sql"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "cta.api.need"]

[tool.ruff.lint.isort]
known-first-party = ["cta", "ctasim"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
markers = [
  "db: needs PostgreSQL (CTA_TEST_DATABASE_URL)",
  "gateway: starts the Go gateway (needs go)",
  "slow: runs a season or the full evaluation",
]
