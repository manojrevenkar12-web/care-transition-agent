# Traces from the platform (GenAI semantic conventions: invoke_agent, chat, execute_tool) go to Jaeger. Span
# attributes carry ids, models, token counts and statuses, never document text (content capture is off).
receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
processors:
  batch: {}
  attributes/drop-content:
    actions:
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}
      - {key: gen_ai.input.messages, action: delete}
      - {key: gen_ai.output.messages, action: delete}
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: {insecure: true}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/drop-content, batch]
      exporters: [otlp/jaeger]
